<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        let students = [];

          function add_student(){
            let name = document.getElementById("nameInput").value;
            let subject = document.getElementById("subjectInput").value;
            let score = document.getElementById("scoreInput").value;

            if(name === '' || subject === '' || score === ''){
                alert("모든 값을 입력하세요");
                return;
            }

            // 넘어온 값을 객체에 추가
            let newStudent = {
                name : name,
                subject : subject,
                score : Number(score)
            };

            // 배열의 추가하기
            students.push(newStudent);
            printStudent();
        }



        function printStudent(){

            let studentList = document.getElementById("studentList")
          
            if(students.length===0){
                studentList.innerText ="학생이 없습니다.";
                return;
            }

              let html = "";

              for(let student of students){
                let result = "";
                if(student.score>=60){
                    result="합격";
                }else{
                    result="불합격"
                }
              }

              html += student.name + "/";
              html += student.subject + "/";
              html += student.score + "/";
              studentList.innerHTML = html;

              printStudent()     
        }

    </script>
</head>
<body>
     <h1>학생 정보 관리</h1>

    이름 : <input id="nameInput">
     <br><br>
    과목 : <input id="subjectInput">
     <br><br>
    점수 : <input id="scoreInput">
    <br><br>
    <button onclick="add_student()">학생추가</button>
    
    <h2>수강생 목록</h2>
    <div id="studentList"></div>
</body>
</html>
