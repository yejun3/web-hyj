<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 랜덤 강아지 사진 가져오기 -->
    <h2> 랜덤 강아지 사진 가져오기</h2>
    <button id="btn">사진 가져오기</button>
    <br><br>
    <img id="photo" width ="300px">

    <hr>

    <h2>음악검색하기</h2>
    <!-- 검색어를 입력하고 검색버튼을 누르면 리스트로 5개를 표시-->
     <input id="musicInput" placeholder="검색어 입력">
     <button id="search">검색하기</button>

    <hr>

     <h2>https 상태 코드 확인하기</h2>
     <button id="btn3">상태확인하기</button>
     <div id =result4></div>

     <h2>POST 요청하기</h2>
     <input id="name" placeholder="이름입력"><br>
     <input id="email" placeholder="이메일 입력"><br>
     <button id="btn4">추가하기</button>
     <div id="result5"></div>

    <script>
        document.getElementById("btn").addEventListener("click",async ()=>{
            fetch("https://picsum.photos/v2/list?page=2&limit=100")
            .then(res => {
                if(!res.ok){
                    console.log("데이터 불러오기 실패");
                }
                return res.json();
            })
            .then(data => {
                //0 ~ data.length-1 사이의 랜덤 번호 생성
                const random = Math.floor(Math.random() * data.length);

                //랜덤 이미지 출력하기
                document.getElementById("photo").src = data[random].download_url;
            });
        })

        // 1.버튼 클릭 이벤트 등록
        document.getElementById("btn").addEventListener("click", () => {
            //input 태그 지정
            const keyword = document.getElementById("search").value.trim();
        
            //2. 검색 유효성 검사
            if (!keyword) {
                alert("검색어를 입력하세요");
                return;
            }
            
            //3. fetch를 써서 url을 통해 필요한 데이터 요청 보내기
            fetch(`https://itunes.apple.com/search?term=${keyword}&entity=song&limit=5`)
            //4. 응답 확인 및 JSON 변환
            .then(res => {
                if (!res.ok) {
                    throw new Error("검색 실패");
                }
                return res.json();
            })
            // 5. 데이터 처리 및 HTML 출력
            .then(data => {
                const html = data.results.length ? 
                data.results.map(item =>`<li>${item.trackName} - ${item.artistName}</li>`).join("")
                : "<li>검색 결과 없음</li>";
                document.getElementById("result").innerHTML = html;
            })
            // 6. 에러 처리
            .catch(err => {
                console.error("에러:", err);
                alert("검색 중 문제가 발생했습니다");
            });
        });


        document.getElementById("btn3").addEventListener("click", ()=>{
            fetch("https://jsonplaceholder.typicode.com/todos/1")
            .then(response=>{
                document.getElementById("result4").innerText =response.ok;
                if(!response.ok){
                    throw new Error("회원정보를 불러오지 못했습니다.");
                }
                return response.json();
            })
            .then(data=>{
                document.getElementsByName("result4").innerText=data
            })
            .catch(err => {
                console.error("에러:", err);
                alert("검색 중 문제가 발생했습니다");
            });
        })

        let name= document.getElementById("name").value;
        let email= document.getElementById("email")
        let result5= document.getElementById("result5")

        const member = {
            name :name,
            email : email
        }


        // 서버에 데이터를 보낼 때는 method, headers, body를 사용해야한다.
     document.getElementById("btn4").addEventListener("click", () => {
    fetch("https://jsonplaceholder.typicode.com/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(member)
     })
     .then(response => response.json())
     .then(data => console.log("등록결과 :", data))
    });
    </script>
</body>
</html>
