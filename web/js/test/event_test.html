<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<select id="fruit">
  <option>사과</option>
  <option>바나나</option>
  <option>포도</option>
</select>

<hr>
<div id="result2"></div>

<hr>
<input id="userInput" type="text" placeholder="아이디 입력">

<script>
  const fruitSelect = document.getElementById("fruit");
  const resultDiv = document.getElementById("result2");

  fruitSelect.addEventListener("change", function() {
    resultDiv.innerText = "선택한 과일: " + fruitSelect.value;
  });

</script>
</body>
</html>
