<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 입력 검사</title>
  <style>
    * { box-sizing: border-box; }

    body {
      background-color: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 400px;
      padding: 20px 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .container h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .box {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    input {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    span.message {
      font-size: 0.9em;
    }

    button {
      background-color: blue;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: darkblue;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>회원가입</h1>

    <div class="id box">
      <label for="id">아이디</label>
      <input type="text" id="id" placeholder="영문 소문자+숫자 5~12자">
      <span class="message"></span>
    </div>

    <div class="password box">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="영문+숫자+특수문자 8~16자">
      <span class="message"></span>
    </div>

    <div class="email box">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="example@test.com">
      <span class="message"></span>
    </div>

    <div class="name box">
      <label for="name">이름</label>
      <input type="text" id="name" placeholder="한글 2~5자">
      <span class="message"></span>
    </div>

    <button id="btn">가입하기</button>
  </div>

  <script>
    // 정규식 정의
    const regexId = /^[a-z0-9]{5,12}$/;
    const regexPassword = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,16}$/;
    const regexEmail = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
    const regexName = /^[가-힣]{2,5}$/;

    // 검사 함수
    function checkInput(
        inputvalue, // 각 input태그의 id 값이 들어올 변수
        regex, //정규식
        successMsg, //성공메세지
        failMsg // 실패메세지
    ) {
      const input = document.getElementById(inputvalue);
      const message = input.nextElementSibling; // input 바로 다음에 오는 요소

      input.addEventListener("input", () => {
        if(input.value ===""){  
            message.textContent = "";
        }else if (regex.test(input.value)) {
          message.textContent = successMsg;
          message.style.color = "green";
        }else {
          message.textContent = failMsg;
          message.style.color = "red";
        }
      });
    }

    // 각 입력칸 검사 연결 함수 실행
    checkInput("id", regexId, "사용 가능한 아이디입니다.", "아이디는 영문 소문자와 숫자만 사용하여 5~12자로 입력하세요.");
    checkInput("password", regexPassword, "사용 가능한 비밀번호입니다.", "비밀번호는 영문, 숫자, 특수문자를 포함하여 8~16자로 입력하세요.");
    checkInput("email", regexEmail, "올바른 이메일 형식입니다.", "이메일 형식이 올바르지 않습니다.");
    checkInput("name", regexName, "올바른 이름입니다.", "이름은 한글 2~5자로 입력하세요.");

    // 가입하기 버튼 클릭 시 전체 검사
    document.getElementById("btn").addEventListener("click", () => {
      const id = document.getElementById("id").value;
      const pw = document.getElementById("password").value;
      const email = document.getElementById("email").value;
      const name = document.getElementById("name").value;

      if (regexId.test(id) && regexPassword.test(pw) && regexEmail.test(email) && regexName.test(name)) {
        alert("회원가입 성공!");
      } else {
        alert("입력값을 다시 확인하세요.");
      }
    });
  </script>
</body>
</html>
