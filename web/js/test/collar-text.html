<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>실시간 환율 계산기</title>
  <style>
    body {
      background-color: #f3f4f6;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .calculator {
      width: 500px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      text-align: center;
    }

    h1 {
      font-size: 32px;
      color: #2563eb;
    }

    p {
      color: gray;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      height: 50px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    #resultBox {
      display: none;
      background-color: #eff6ff;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }

    #resultBox.show {
      display: block;
    }

    .resultAmount {
      font-size: 30px;
      font-weight: bold;
      color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>실시간 환율 계산기</h1>
    <p>USD를 입력하고 원하는 통화를 선택하세요.</p>

    <input type="number" id="usdInput" placeholder="USD 금액 입력">
    
    <select id="currencySelect">
      <option value="KRW">KRW</option>
      <option value="JPY">JPY</option>
      <option value="EUR">EUR</option>
      <option value="GBP">GBP</option>
    </select>

    <button id="calcBtn">계산하기</button>

    <div id="resultBox"></div>
  </div>

  <script>
    let exchangeRates = {};
    let lastUpdate = "";

    function loadRates() {
      fetch("https://open.er-api.com/v6/latest/USD")
        .then(response => response.json())
        .then(data => {
          exchangeRates = data.rates;
          lastUpdate = data.time_last_update_utc;
          console.log("환율 데이터 갱신:", lastUpdate);
        })
        .catch(error => alert("환율 데이터를 불러오지 못했습니다."));
    }

    // 페이지 실행 시 최초 호출
    window.addEventListener("DOMContentLoaded", loadRates);

    // 10분마다 자동 갱신
    setInterval(loadRates, 10 * 60 * 1000);

    document.getElementById("calcBtn").addEventListener("click", () => {
      const usdValue = document.getElementById("usdInput").value;
      const currency = document.getElementById("currencySelect").value;

      if (!usdValue) {
        alert("USD 금액을 입력하세요.");
        return;
      }
      if (usdValue <= 0) {
        alert("0보다 큰 값을 입력하세요.");
        return;
      }

      const rate = exchangeRates[currency];
      const converted = usdValue * rate;

      const resultBox = document.getElementById("resultBox");
      resultBox.innerHTML = `
        <p>기준 통화: USD</p>
        <p>선택 통화: ${currency}</p>
        <p>입력 금액: ${Number(usdValue).toLocaleString()} USD</p>
        <p>적용 환율: ${rate.toLocaleString()}</p>
        <p class="resultAmount">환산 금액: ${converted.toLocaleString()} ${currency}</p>
        <p>환율 업데이트 시간: ${lastUpdate}</p>
      `;
      resultBox.classList.add("show");
    });
  </script>
</body>
</html>
