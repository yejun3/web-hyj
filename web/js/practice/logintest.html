        // 회원 배열 저장

       let member = {

    }

    members.push(member);

    let id = document.getElementById("userId").value;

    let email = document.getElementById("emailId").value;
    let message = document.getElementById("message");
    let memberlist = document.getElementById("memberList");

    function checkid(){
    let id = document.getElementById("userId").value;
    if(id===""){
        alert("아이디를 입력하세요");
    } else if(members.some(m => m.id === id)){
        message.innerText="아이디가 중복되었습니다.";
    } else {
        message.innerText="사용 가능한 아이디입니다.";
    }
}

function membership(){
    let id = document.getElementById("userId").value;
    let pw = document.getElementById("userPw").value;
    let emailId = document.getElementById("emailId").value;
    let domain = document.getElementById("emailDomain").value;

    if(id==="" || pw==="" || emailId===""){
        alert("모든 항목을 입력하세요");
        return;
    } else if(members.some(m => m.id === id)){
        alert("이미 가입된 아이디입니다.");
        return;
    }

    let newMember = {
        id: id,
        pw: pw,
        email: emailId + "@" + domain
    };
    members.push(newMember);
    message.innerText="회원가입이 완료되었습니다.";

    printMemberList();
}

function printMemberList(){
    let html = "";

        html += "아이디: " + members[i].id + "<br>" +
                "이메일: " + members[i].email + "<hr>";
    }
    memberlist.innerHTML = html;
}
