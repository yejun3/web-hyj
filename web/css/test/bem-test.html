<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product_card{
            border: 1px solid #eee;
            padding: 16px;
            width: 200px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .product-card__image{
            width: 100%;
            height:150px;
            object-fit: cover;
            background-color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #aaa;
        }

        .product-card__title{
            font-size: 18px;
            color: black;
            font-weight: bold;
        }

        .product-card__price{
            font-size: 18px;
            color: red;
            font-weight: bold;
        }
          
                                              
    </style>
</head>
<body>
    <div  class="product-card">
        <div class="product-card__image">image</div>
        <div class="product-card__title">기본 후드티</div>
        <div class="product-card__price">29000원</div>
    </div>

    <div  class="product card product card--soldout">
        <div class="product-card__image">image</div>
        <div class="product-card__title">레이어드 맨투맨</div>
        <div class="product-card__price">29000원</div>
    </div>
    
</body>
</html>
