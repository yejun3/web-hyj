<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 기본 카드 스타일 (.card): 모든 알림 카드는 공통적으로 
        안쪽 여백(padding) 15px, 
        테두리(border) 1px solid #ccc, 
        모서리 둥글기(border-radius) 4px를 가집니다.*/

        .card{
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* 상태별 스타일 (멀티 클래스): .success, .warning, .danger 클래스가 .card와 함께 지정되었을 때만 
        다음과 같이 테두리 색상과 배경색이 바뀌도록 CSS 멀티 클래스 선택자를 작성하세요.

        .success: 테두리 초록색(#2ecc71), 배경색 옅은 초록색(#e8f8f5)

        .warning: 테두리 노란색(#f1c40f), 배경색 옅은 노란색(#fef9e7)

        .danger: 테두리 빨간색(#e74c3c), 배경색 옅은 빨간색(#fdedec)

         심각한 위험 상태 예외 처리: .danger 상태이면서 동시에 .critical 클래스가 함께 존재할 때는, 
         배경색을 더 짙은 빨간색(#c0392b)으로 바꾸고 글자색을 흰색(#ffffff)으로 변경하는 예외 처리를 하세요.  */

         .card.success{
            border-color:#2ecc71;
            background-color: #e8f8f5;
         }

        .card.warning{
            border-color:#f1c40f;
            background-color: #fef9e7;
         }

        .card.danger{
            border-color:#e74c3c;
            background-color: #fdedec;
         }

         .card.danger.critical{
            color: #ffffff;
            background-color: #c0392b;
         }


        

    </style>
</head>
<body>
    <h1>문제 1번</h1>
    <div class="card success">성공 메시지</div>
    <div class="card warning">경고 메시지</div>
    <div class="card danger">오류 메시지</div>
    <div class="card danger critical">매우 심각한 오류 메세지</div>
    
</body>
</html>
