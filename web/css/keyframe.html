<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box{
            width: 120px;
            height: 120px;
            border-radius: 16px;
            background-color: #60a5fa;
            animation: bounceColor 2.4s ease-in-out infinite alternate;
        }

     @keyframes bounceColor{
      0%   { transform: translateY(0);    background:#60a5fa; }
      50%  { transform: translateY(-24px); background:#f59e0b; }
      100% { transform: translateY(0);    background:#8b5cf6; }
     }
     
        .spinner{
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 6px solid #e5e7eb;
            border-top-color 
             :  #3b82f6;
            animation: spin 1s linear infinite;
        }

        

     @keyframes spin{
        to  {transform: rotate(360deg)}    
     }

     .badge{
        display: inline-block;
        padding: 10px 14px;
        border-radius: 999px;
        background-color: #8b5cf6;
        color: white;
        font-weight: 700;
        /* step(): 애니메이션을 일정한 단계로 끊어서
        움직이게 만드는 함수  */
        animation: hop 0.8s steps(4,end) infinite alternate;
     }

     @keyframes hop {
        from{
            transform: translateX(0);
        }

        to{
            transform: translateX(80px);
        }
        
     }
    </style>
</head>
<body>
    <h2>바운스 박스</h2> 
    <div class="box"></div>
    <h2>스피너</h2>
    <div class="spinner"></div>
    <hr>
    <h2>step 애니메이션</h2>
    <span class="badge">STEP</span>
</body>
</html>
