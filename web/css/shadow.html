<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            display: flex;
            flex-direction: column;
            gap:10px;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box{
            width: 200px;
            padding: 30px;
            background-color: aqua;
            border: 1px solid black;
            text-align: center;

            /* box-shadow : x축 y축 흐린 정도 퍼짐정도 색깔 */
            /* box-shadow : x축 y축  흐린 정도 색깔 */
            /* rgba(R, G, B 투명도 0~1사이)*/
            /* inset은 그림자가 안쪽에 생성 */
            box-shadow: inset 10px 10px 30px 0px rgb(104, 93, 93);
        }

         /* inset을 활용하여 입력창이나 눌린 버튼같은 느낌을 만들 수 있다. */

        .input-box{
            width: 250px;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            text-align: center;
        }

        .input-box:active{
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.2);
        }

        .card{
            width: 320px;
            padding: 24px;
            background-color: white;
            border-radius: 16px;

            box-shadow: 
             0 2px 6px rgba(0,0,0,0.08),
             0 12px 24px rgba(0,0,0,0.12)
        }

        .title{
            font-size: 48px;
            color: white;
            background-color: #333;
            padding: 30px;
        }

        
    </style>
</head>
<body>
    <!-- text-shadow : 글자의 그림자
         box-shadow : 박스, 카드, 버튼 같은 요소의 그림자 -->
    <div class="box">기본 그림자</div>

    <div class="input-box">안쪽 그림자</div>

    <!-- 자연스러운 카드 그림자 -->
     <div class="card">
        <h2>프리미엄 카드</h2>
        <p>두 개의 그림자를 겹쳐서 더 자연스럽게 만들었다.</p>
     </div>

     <h1 class="title"> CSS TEXT SHADOW</h1>
</body>
</html>
