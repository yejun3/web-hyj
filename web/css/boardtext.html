<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>📌 자유게시판</title>
  <style>
    /* 기본 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      padding: 20px;
    }

    /* 게시판 전체 박스 */
    .board-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    /* 헤더 영역 */
    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #ddd;
    }

    .board-title {
      font-size: 20px;
      font-weight: bold;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .write-btn {
      padding: 6px 12px;
      border: none;
      background: #007bff;
      color: #fff;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* 게시글 목록 영역 */
    .list-header,
    .post-row {
      display: flex;
      align-items: center;
      padding: 10px 15px;
    }

    .list-header {
      background: #f9f9f9;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .post-row {
      border-bottom: 1px solid #eee;
    }

    /* 각 열 크기 */
    .col-no {
      width: 60px;
    }
    .col-author {
      width: 100px;
    }
    .col-date {
      width: 110px;
    }
    .col-views {
      width: 70px;
    }
    .col-title {
      flex: 1;
    }

    /* 제목 링크 */
    .col-title a {
      color: #007bff;
      text-decoration: none;
    }

    /* 페이지 번호 영역 */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 15px;
    }

    .page-btn {
      padding: 6px 12px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }

    .page-btn.active {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
    }
  </style>
</head>
<body>
  <div class="board-container">
    <!-- 헤더 영역 -->
    <header class="board-header">
      <h1 class="board-title">📌 자유게시판</h1>
      <div class="header-actions">
        <input type="text" class="search-box" placeholder="제목을 검색하세요">
        <button class="write-btn">글쓰기</button>
      </div>
    </header>

    <!-- 게시글 목록 제목 영역 -->
    <div class="list-header">
      <span class="col-no">번호</span>
      <span class="col-title">제목</span>
      <span class="col-author">작성자</span>
      <span class="col-date">작성일</span>
      <span class="col-views">조회수</span>
    </div>

    <!-- 게시글 목록 영역 -->
    <div class="post-list">
      <div class="post-row">
        <span class="col-no">5</span>
        <span class="col-title"><a href="#">도서관 휴관 안내 (6월 25일)</a></span>
        <span class="col-author">관리자</span>
        <span class="col-date">2026-06-18</span>
        <span class="col-views">128</span>
      </div>
      <div class="post-row">
        <span class="col-no">4</span>
        <span class="col-title"><a href="#">신간 도서 입고 안내드립니다</a></span>
        <span class="col-author">관리자</span>
        <span class="col-date">2026-06-15</span>
        <span class="col-views">96</span>
      </div>
      <div class="post-row">
        <span class="col-no">3</span>
        <span class="col-title"><a href="#">스터디룸 예약 방법 문의드립니다</a></span>
        <span class="col-author">김도윤</span>
        <span class="col-date">2026-06-12</span>
        <span class="col-views">54</span>
      </div>
      <div class="post-row">
        <span class="col-no">2</span>
        <span class="col-title"><a href="#">반납 연체료 관련 질문있어요</a></span>
        <span class="col-author">이서연</span>
        <span class="col-date">2026-06-10</span>
        <span class="col-views">41</span>
      </div>
      <div class="post-row">
        <span class="col-no">1</span>
        <span class="col-title"><a href="#">전자책 대출 서비스 오픈했습니다</a></span>
        <span class="col-author">관리자</span>
        <span class="col-date">2026-06-05</span>
        <span class="col-views">203</span>
      </div>
    </div>

    <!-- 페이지 번호 영역 -->
    <div class="pagination">
      <button class="page-btn">이전</button>
      <button class="page-btn active">1</button>
      <button class="page-btn">2</button>
      <button class="page-btn">3</button>
      <button class="page-btn">4</button>
      <button class="page-btn">5</button>
      <button class="page-btn">다음</button>
    </div>
  </div>
</body>
</html>
