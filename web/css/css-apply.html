<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <!-- 내부 스타일 방식 -->
    <style>
        /* 현 페이지에 있는 모든 h1태그에게 스타일을 적용 */
        /* 스타일은 헤드 부분에 작성 */
        h1 {color:blue;}
        p {color:green;}
    </style>
    <!-- 외부 스타일 시트 추가하기 -->
     <link rel ="stylesheet" href = "./apply.css">
     <!-- 외부 스타일 정의를 내부스타일보다 위에 작성한 경우 
      마지막에 적용된 것이 내부스타일이므로 내부 스타일이 표현된다.-->

</head>
<body>
 
    <h1>내부 스타일 시트 적용</h1>
    <h1>내부 스타일 시트 적용2</h1>
    <!-- 인라인 방식 -->
     <!-- 인라인 방식이 내부스타일 방식보다 우선순위가 높다. -->
    <p style = "color:red">인라인 방식을 적용</p>
    <p>여기에는 인라인 방식이 반영되지 않는다.</p>
    <span>외부 스타일 시트 적용</span>

    <!-- 스타일 적용 순위 
     1. 인라인
     2. 외부 스타일 시트/ 내부 스타일 시트
     ㄴ 가장 최근 스타일을 적용을 시킨다.-->


</body>
</html>
