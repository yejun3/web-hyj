<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <table> ~ </table> 테이블을 만들어주는 태그
     <tr> : 행을 만들어주는 태그
     <td> : 열을 만들어주는 태그
     <th> : 테이블 헤더로 테이블 각 열을 대표하는 셀-->
    <table border="1">
        <tr>
            <td>1행 1열</td>
            <td>1행 2열</td>
        </tr>
    </table>

    <hr>

     <table border="1">
        <tr>
            <td>1행 1열</td>
        </tr>
       
        <tr>
            <td>2행 1열</td>
        </tr>
        
    </table>
    
    <hr>
    <!-- 2행 2열자리 테이블 만들기 -->
     <table border="1">
        <tr>
            <td>1행 1열</td>
            <td>1행 2열</td>
        </tr>
        
        <tr>
            <td>2행 1열</td>
            <td>2행 2열</td>
            
        </tr>
    </table>
   
     <!-- 열 합치기  -->
     <table border = "1">
		<tr>
			<td colspan="3">메뉴판</td>
		</tr>
    <hr>
		<tr>
			<td>짜장</td>
			<td>짬뽕</td>
			<td>탕수육</td>
		</tr>
	  </table>
    <hr>
    <!-- 열 합치기  -->
    <table border="1">
		<tr>
			<td rowspan="2">메뉴판</td>
			<td>짜장</td>
		</tr>
			<td>짬뽕</td>
		</tr>
     </table>

     <hr>

     <table border = "1">
        <caption> 주요 sns서비스율 이용률(%)</caption>
        <tr> 
            <td></td>
            <td>페이스북</td>
            <td>인스타그램</td>
            <td>페이스북</td>
            <td>밴드</td>
            <td>트위터</td>
        </tr>

        <tr>
            <td>2015</td>
            <td>77.1</td>
            <td>58.3</td>
            <td>32.4</td>
            <td>16.7</td>
            <td>14.5</td>
        </tr>
            <td>2017</td>
            <td>77.5</td>
            <td>50.3</td>
            <td>12.4</td>
            <td>15.6</td>
            <td>24.5</td>
        </tr>
     </table>
    <hr>

</body>
</html>
