<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 이미지 태그 (img)
     웹 페이지에서 이미지를 표시하기 위해서 사용한다.
     필수 속성 
     src - 이미지 경로를 지정
     alt - 이미지 대체 문구 (이미지가 노출되지 않은 경우에 대체 노출되는 문구)
     
     width, height 속성
     이미지의 너비와 높이를 지정할 수 있다.-->
     <p>
        <!-- ./  : 현재 자신의 경로
             ../ : 상위경로 -->
        <img src="../img/dog1.jpg" alt ="dog">
     </p>
     <p>
        <!-- /  : 루트 경로를 의미한다. -->
        <img src="/img/dog1.jpg" alt ="dog" width="200" height="100">
     </p>

     <p>
        <img src="https://tse1.mm.bing.net/th/id/OIP.XjiAVDS-O3Er0Q4JjsL9lAHaD2?rs=1&pid=ImgDetMain&o=7&rm=3">
     </p>
</body>
</html>
